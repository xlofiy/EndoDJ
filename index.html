<!doctype html>
<html lang="en" data-theme="endo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EndoDJ — free, open source DJ software" />
    <title>EndoDJ</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23061a44' stroke='%2319c3ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff3fb4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="splash">
      <div class="bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="splash-box">
        <h1 class="logo-slab"><span>ENDO</span><b>DJ</b></h1>
        <p class="tagline">free · open source · made for the DDJ-FLX2</p>
        <button id="start-btn" class="big">Start EndoDJ</button>
        <p class="hint">Use Google Chrome or Microsoft Edge (or the EndoDJ desktop app). Plug in your controller and allow MIDI access when asked.</p>
        <p id="splash-error" class="error"></p>
      </div>
    </div>

    <header id="topbar">
      <div class="logo-slab small"><span>ENDO</span><b>DJ</b></div>
      <button id="midi-status" class="chip" title="Controller settings">MIDI: —</button>
      <button id="automix-btn" class="chip" title="Automatically mix through the Automix queue">Automix</button>
      <button id="rec-btn" class="chip" title="Record your mix">● REC</button>
      <span id="rec-time" class="mono"></span>
      <div class="spacer"></div>
      <button id="layout-btn" class="chip" title="Switch between full decks and a compact layout with a bigger song list">Layout: Full</button>
      <label class="inline master">MASTER <input id="master-level" type="range" min="0" max="1" step="0.001" value="0.8" /></label>
      <canvas id="master-meter" class="meter-h"></canvas>
      <button id="settings-btn" class="chip">Settings</button>
      <button id="help-btn" class="chip" title="Keyboard shortcuts">?</button>
    </header>
    <div class="checker" aria-hidden="true"></div>

    <main id="main">
      <section id="waveforms">
        <canvas id="zoom-0" class="zoom"></canvas>
        <canvas id="zoom-1" class="zoom"></canvas>
      </section>

      <section id="console">
        <div class="deck" id="deck-0"></div>
        <div id="mixer"></div>
        <div class="deck" id="deck-1"></div>
      </section>

      <div id="splitter" title="Drag to resize the song list" role="separator" aria-orientation="horizontal"></div>

      <section id="library">
        <aside id="lib-sidebar"></aside>
        <div id="lib-main">
          <div id="lib-toolbar">
            <input id="lib-search" type="search" placeholder="Search title, artist, BPM…" />
            <button id="add-folder-btn">Add folder</button>
            <button id="add-files-btn">Add files</button>
            <input id="file-input" type="file" accept="audio/*" multiple hidden />
            <button id="analyze-btn" title="Detect BPM for all tracks that have not been analysed yet">Analyse BPM</button>
            <span id="lib-export"></span>
            <span id="lib-status" class="muted"></span>
          </div>
          <div id="lib-table-wrap">
            <table id="lib-table">
              <thead></thead>
              <tbody></tbody>
            </table>
            <div id="lib-empty" class="muted"></div>
          </div>
          <div id="looplab" hidden></div>
        </div>
      </section>
    </main>

    <dialog id="controller-dlg">
      <h2>Controller</h2>
      <div id="controller-body"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>

    <dialog id="settings-dlg">
      <h2>Settings</h2>
      <div id="settings-body"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>

    <dialog id="help-dlg">
      <h2>Keyboard shortcuts</h2>
      <div id="help-body"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>

    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
