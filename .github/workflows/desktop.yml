name: Desktop installers
# Builds the EndoDJ desktop app for Windows (.exe installer) and Linux (.AppImage / .deb).
# - Pull requests: installers as run artifacts, for testing.
# - Every push to main or the development branch, version tags and manual runs: a GitHub Release,
#   so the installed app updates itself after every change. Installed apps auto-update from the
#   latest Release (electron-updater reads latest.yml / latest-linux.yml from it).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, claude/epic-dijkstra-m4lk0o]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # installers are not code-signed yet (see docs/INSTALL.md)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set release version
        # each release needs a higher version than the last so installed apps see it as an update
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.2.${{ github.run_number }}"; fi
          npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm run dist
      - name: Check the native MIDI library is in the app
        shell: bash
        run: |
          ls release/*-unpacked/resources/app.asar.unpacked/node_modules/@julusian/midi/prebuilds/ | grep -E "midi-(win32|linux)-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: EndoDJ-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    # publish whatever installers were built, even if one platform failed
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.2.{0}', github.run_number) }}
          name: EndoDJ ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.2.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: installers/*
